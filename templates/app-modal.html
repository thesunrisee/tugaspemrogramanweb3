<!-- Template <app-modal> (id: tpl-modal). Root: <div class="modal-backdrop"> -->
<!-- v-if: seluruh modal hanya dibuat di DOM saat "visible" bernilai true -->
<div class="modal-backdrop" v-if="visible" @click.self="cancel">
  <div class="modal" role="dialog" aria-modal="true" :aria-label="title">
    <h3 class="modal-title">{{ title }}</h3>
    <p class="modal-message">{{ message }}</p>
    <div class="modal-actions">
      <!-- Tombol Batal hanya muncul pada mode konfirmasi -->
      <button v-if="mode === 'confirm'" type="button" class="btn" @click="cancel">{{ cancelText }}</button>
      <button type="button" class="btn btn-primary" :class="{ 'btn-danger': mode === 'confirm' }" @click="ok">{{ okText }}</button>
    </div>
  </div>
</div>
